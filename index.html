<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>填寫預約資料</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }
        h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        .form-group { background-color: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #555; }
        input[type="text"], input[type="tel"], input[type="date"], input[type="time"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .checkbox-container { display: block; position: relative; padding-left: 35px; margin-bottom: 15px; cursor: pointer; font-size: 16px; }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 25px; width: 25px; background-color: #eee; border-radius: 5px; }
        .checkbox-container:hover input ~ .checkmark { background-color: #ccc; }
        .checkbox-container input:checked ~ .checkmark { background-color: #06C755; }
        .checkmark:after { content: ""; position: absolute; display: none; }
        .checkbox-container input:checked ~ .checkmark:after { display: block; }
        .checkbox-container .checkmark:after { left: 9px; top: 5px; width: 5px; height: 10px; border: solid white; border-width: 0 3px 3px 0; transform: rotate(45deg); }
        .submit-btn { background-color: #06C755; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin-top: 10px; }
    </style>
</head>
<body>

    <h2>📝 預約服務表單</h2>

    <div class="form-group">
        <label>您的稱呼：</label>
        <input type="text" id="userName" placeholder="讀取中..." required>
    </div>

    <div class="form-group">
        <label>聯絡電話：</label>
        <input type="tel" id="userPhone" placeholder="例如：0912345678" required>
    </div>

    <div class="form-group">
        <label>選擇服務（可多選）：</label>
        <label class="checkbox-container">剪髮<input type="checkbox" name="service" value="剪髮"><span class="checkmark"></span></label>
        <label class="checkbox-container">洗髮<input type="checkbox" name="service" value="洗髮"><span class="checkmark"></span></label>
        <label class="checkbox-container">染髮<input type="checkbox" name="service" value="染髮"><span class="checkmark"></span></label>
        <label class="checkbox-container">深層護髮<input type="checkbox" name="service" value="深層護髮"><span class="checkmark"></span></label>
    </div>

    <div class="form-group">
        <label>預約日期：</label>
        <input type="date" id="bookDate" required>
    </div>

    <div class="form-group">
        <label>預約時間段：</label>
        <input type="time" id="bookTime" required> 
    </div>

    <button class="submit-btn" onclick="submitForm()">確認預約</button>

    <script>
        // 🚨 一樣記得把這裡換成你的 LIFF ID！
        const myLiffId = "2010102925-iB0pBRk6"; 

        async function initializeLiff() {
            try {
                await liff.init({ liffId: myLiffId });
                
                // 🌟 神奇魔法加在這裡：如果是登入狀態，就去抓取 LINE 名字
                if (liff.isLoggedIn() || liff.isInClient()) {
                    const profile = await liff.getProfile();
                    // 將抓到的名字 (profile.displayName) 自動填入輸入框
                    document.getElementById('userName').value = profile.displayName;
                }

            } catch (err) {
                console.error('LIFF 初始化失敗', err);
            }
        }
        initializeLiff();

        async function submitForm() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const date = document.getElementById('bookDate').value;
            const time = document.getElementById('bookTime').value;

            const checkboxes = document.querySelectorAll('input[name="service"]:checked');
            let selectedServices = [];
            checkboxes.forEach((cb) => { selectedServices.push(cb.value); });

            if (!name || !phone || !date || !time || selectedServices.length === 0) {
                alert("請將所有資料填寫完整喔！");
                return;
            }

            const serviceText = selectedServices.join(", ");
            const messageToBot = `【預約單送出】\n姓名：${name}\n電話：${phone}\n服務：${serviceText}\n日期：${date}\n時間：${time}`;

            if (liff.isInClient()) {
                try {
                    await liff.sendMessages([{ type: "text", text: messageToBot }]);
                    liff.closeWindow();
                } catch (error) {
                    alert("傳送失敗：" + error);
                }
            } else {
                alert("表單已送出（測試模式）：\n\n" + messageToBot);
            }
        }
    </script>
</body>
</html>

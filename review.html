<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>傾聽您的聲音</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }
        .card { background-color: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        h2 { font-size: 20px; color: #1DB446; margin-bottom: 5px; }
        p { color: #777; font-size: 14px; margin-bottom: 20px; }
        .stars { display: flex; justify-content: center; flex-direction: row-reverse; margin-bottom: 20px; }
        .stars input { display: none; }
        .stars label { font-size: 36px; color: #ddd; cursor: pointer; padding: 0 5px; transition: color 0.2s; }
        .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: #F5A623; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; height: 80px; resize: none; }
        .submit-btn { background-color: #1DB446; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>感謝您今日的蒞臨 ✨</h2>
        <p>INA 男士理髮致力於提供最好的服務，期待您的寶貴意見！</p>

        <div class="form-group" style="text-align: center;">
            <label>整體滿意度評分</label>
            <div class="stars">
                <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
                <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
            </div>
        </div>

        <div class="form-group">
            <label>想對設計師說的話（評價）：</label>
            <textarea id="comment" placeholder="您的讚美是我們前進的動力..."></textarea>
        </div>

        <div class="form-group">
            <label>有待改善的建議（選填）：</label>
            <textarea id="suggestion" placeholder="例如：音樂太大聲、冷氣太冷等..."></textarea>
        </div>

        <button class="submit-btn" onclick="submitReview()">送出評價</button>
    </div>

    <script>
        // 🚨 步驟二完成後，這裡要換成你專屬的「第二組 LIFF ID」！
        const reviewLiffId = "填入你的_評價網頁_LIFF_ID"; 

        async function initializeLiff() {
            try {
                await liff.init({ liffId: reviewLiffId });
            } catch (err) {
                console.error('LIFF 初始化失敗', err);
            }
        }
        initializeLiff();

        async function submitReview() {
            const ratingOpt = document.querySelector('input[name="rating"]:checked');
            const comment = document.getElementById('comment').value;
            const suggestion = document.getElementById('suggestion').value || "無";

            if (!ratingOpt) {
                alert("請幫我們勾選星星評分喔！");
                return;
            }

            const stars = "⭐".repeat(parseInt(ratingOpt.value));
            const messageToBot = `【評價送出】\n評分：${stars}\n評價：${comment}\n建議：${suggestion}`;

            if (liff.isInClient()) {
                try {
                    await liff.sendMessages([{ type: "text", text: messageToBot }]);
                    liff.closeWindow();
                } catch (error) {
                    alert("傳送失敗：" + error);
                }
            } else {
                alert("表單已送出（測試模式）：\n\n" + messageToBot);
            }
        }
    </script>
</body>
</html>
